[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tensorcost-litellm"
version = "0.1.3"
description = "A LiteLLM proxy guardrail that checks TensorCost budgets before each call, and a logger that reports spend back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Vaadh Labs" }]
keywords = ["litellm", "llm", "budget", "cost", "guardrail"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The proxy itself; the plugin runs inside it. fastapi comes with it.
proxy = ["litellm[proxy]>=1.60"]
test = ["pytest>=8", "fastapi>=0.110"]

[project.urls]
Homepage = "https://tensorcost.com"

[tool.hatch.build.targets.wheel]
packages = ["tensorcost_litellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
