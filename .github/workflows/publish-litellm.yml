name: publish-litellm

# Publishes tensorcost-litellm to PyPI through trusted publishing (OIDC),
# so no API token lives in the repo. Push a tag like litellm-v0.1.0.
# The pypi environment can carry a required reviewer in GitHub settings.
on:
  push:
    tags: ["litellm-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: litellm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          want="${GITHUB_REF_NAME#litellm-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag $want != pyproject $have"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: litellm/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
