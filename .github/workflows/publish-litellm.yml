name: publish-litellm

# Publishes tensorcost-litellm to PyPI through trusted publishing (OIDC),
# so no API token lives in the repo. Push a tag like litellm-v0.1.5.
# The pypi environment can carry a required reviewer in GitHub settings.
# PyPI's trusted publisher names this file and the pypi environment: keep
# both names as they are, or publishing stops matching it.
on:
  push:
    tags: ["litellm-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: litellm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          want="${GITHUB_REF_NAME#litellm-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag $want != pyproject $have"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        working-directory: .
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      # The full rules on the exact files PyPI gets; a publish never runs without the private patterns.
      - name: Guard the sdist and wheel
        working-directory: .
        env:
          TC_GUARD_PATTERNS: ${{ secrets.OSS_GUARD_PATTERNS }}
        run: for f in litellm/dist/*; do node tools/guard.mjs --archive "$f" --require-private --gitleaks; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: litellm/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
